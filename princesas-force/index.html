<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Princesas Force 3D</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="app">

<section id="menu" class="screen active">
  <div class="menu-box">
    <h1>PRINCESAS<br><span>FORCE 3D</span></h1>
    <p class="sub">FPS Raycaster · Estilo CS 1.6</p>
    <button class="mbtn gold" id="btn-play">⚔️ JOGAR</button>
    <button class="mbtn" id="btn-help">📖 CONTROLES</button>
    <p class="ver">v6.0 · 3D Raycaster · Sem dependências</p>
  </div>
</section>

<section id="game" class="screen">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="hud-top">
      <div class="sc"><span class="sc-t" id="ht-t">0</span>:<span class="sc-ct" id="ht-ct">0</span></div>
      <div class="tm" id="ht-time">0:55</div>
    </div>
    <div class="hud-bot">
      <div class="hb-l">
        <span class="hp-v">+<span id="hb-hp">100</span></span>
      </div>
      <div class="hb-c" id="hb-money">$800</div>
      <div class="hb-r">
        <span class="wn" id="hb-wep">Glock-18</span>
        <span class="am" id="hb-ammo">20/20</span>
      </div>
    </div>
    <div class="crosshair"></div>
    <div class="kf" id="kf"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="jz" id="jz"><div class="jb" id="jb"><div class="jk" id="jk"></div></div></div>
  <div class="az" id="az"></div>
  <div class="ab">
    <button class="abtn" id="b-rel">↻</button>
    <button class="abtn" id="b-nade">💣</button>
    <button class="abtn fire" id="b-fire">⊕</button>
  </div>
</section>

</div>
<script src="js/fps3d.js"></script>
</body>
</html>
